name: CI - Auth Service

on:
  push:
    branches: [main]
    paths:
      - 'services/auth-service/**'
  pull_request:
    paths:
      - 'services/auth-service/**'

defaults:
  run:
    working-directory: services/auth-service

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run unit tests
        env:
          JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET_TEST }}
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
          TEST_DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
        run: pytest tests/test_security.py -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/authdb_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/authdb_test
          JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET_TEST }}
        run: pytest tests/test_main.py -v

  security:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pip-audit bandit
      - name: Dependency vulnerabilities
        run: pip-audit
      - name: Static security scan
        run: bandit -r app/